services:
  traffic:
    build:
      context: ..
    env_file: ../.env
    environment:
      TRAFFIC_ENV: production
      HOST: 0.0.0.0
      PORT: 8000
      RESULTS_DIR: /data/results
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - traffic-data:/data
    mem_limit: 448m
    cpus: 0.25
    pids_limit: 64
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    stop_grace_period: 20s
    restart: unless-stopped
volumes:
  traffic-data:
